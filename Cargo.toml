
[package]
name = "silenwm"
version = "0.1.0"
edition = "2024"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"

tracing = "0.1"

winit = { version = "0.30", default-features = false, features = [
    "wayland",
    "x11",
] }
